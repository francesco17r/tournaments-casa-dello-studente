<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tournament Organiser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261127c">
<style>
  .match-edit { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .match-edit:first-child { border-top: 0; }
  .match-edit .a { text-align: right; }
  .match-edit .inputs { display: flex; gap: 4px; align-items: center; }
  .match-edit.tie .inputs input { border-color: var(--danger); }
  .confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }
  .form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); }
  .form-grid label input, .form-grid label select { width: 100%; }
  #stato.ok { color: var(--ok); } #stato.err { color: var(--danger); } #stato.warn { color: var(--warn); }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <span class="eyebrow">Organiser only</span>
    <h1 style="margin-top:6px">Manage tournaments</h1>
    <p>Enter players and results, then press "Save to site". <a href="./">Go to the public site</a></p>
  </div>
</header>
<nav class="tabs" aria-label="Sections">
  <div class="wrap">
    <a href="#impostazioni" data-tab="impostazioni">Settings</a>
    <a href="#biliardino" data-tab="biliardino" style="--tab-color:var(--biliardino)">Table football</a>
    <a href="#pingpong" data-tab="pingpong" style="--tab-color:var(--pingpong)">Ping pong</a>
    <a href="#scacchi" data-tab="scacchi" style="--tab-color:var(--scacchi)">Chess</a>
  </div>
</nav>
<main class="wrap">
  <div id="view"><p class="muted">Loading…</p></div>
</main>
<div class="savebar">
  <div class="wrap">
    <span id="stato" class="muted">No changes</span>
    <div class="row">
      <button id="scarica" type="button">Download copy</button>
      <button id="salva" type="button" class="primary" disabled>Save to site</button>
    </div>
  </div>
</div>

<script src="js/engine.js?v=20261127c"></script>
<script src="js/vista.js?v=20261127c"></script>
<script>
(function () {
  'use strict';
  var T = window.Tornei, V = window.Vista, esc = V.esc;
  var FILE = 'data/tornei.json';
  var dati = null, sha = null, modificato = false, conferma = null, avviso = {};

  /* ---------- Settings and local storage ---------- */
  function leggi(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function scrivi(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }

  function repoPredefinito() {
    var h = location.hostname, p = location.pathname.split('/').filter(Boolean);
    if (/\.github\.io$/.test(h)) return { owner: h.split('.')[0], repo: p.length && !/\.html$/.test(p[0]) ? p[0] : h };
    return { owner: '', repo: '' };
  }
  var cfg = (function () {
    var d = repoPredefinito();
    return {
      owner: leggi('tornei.owner') || d.owner,
      repo: leggi('tornei.repo') || d.repo,
      branch: leggi('tornei.branch') || 'main',
      token: leggi('tornei.token') || ''
    };
  })();

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, opts.headers || {});
    if (cfg.token) opts.headers.Authorization = 'Bearer ' + cfg.token;
    return fetch('https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.message || ('Error ' + r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
  }
  function b64enc(s) { return btoa(unescape(encodeURIComponent(s))); }
  function b64dec(s) { return decodeURIComponent(escape(atob(s.replace(/\n/g, '')))); }

  function stato(testo, cls) {
    var el = document.getElementById('stato');
    el.textContent = testo; el.className = cls || 'muted';
  }
  function segnaModifica() {
    modificato = true;
    scrivi('tornei.bozza', JSON.stringify({ dati: dati, sha: sha, quando: Date.now() }));
    stato('Unsaved changes', 'warn');
    document.getElementById('salva').disabled = !cfg.token;
  }

  function carica() {
    var bozza = null;
    try { bozza = JSON.parse(leggi('tornei.bozza') || 'null'); } catch (e) {}
    var p = (cfg.token && cfg.owner && cfg.repo)
      ? api('/contents/' + FILE + '?ref=' + encodeURIComponent(cfg.branch) + '&t=' + Date.now()).then(function (j) { sha = j.sha; return JSON.parse(b64dec(j.content)); })
      : fetch(FILE + '?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); });
    p.then(function (d) {
      dati = d;
      if (bozza && bozza.dati && bozza.sha === sha && JSON.stringify(bozza.dati) !== JSON.stringify(d)) {
        avviso.bozza = bozza;
      }
      stato(cfg.token ? 'Connected to GitHub' : 'Not connected: add your key in Settings to save', cfg.token ? 'ok' : 'warn');
      render();
    }).catch(function (e) {
      document.getElementById('view').innerHTML = '<div class="stack"><p class="notice err">Could not load the data: ' + esc(e.message) +
        '. Check the settings.</p></div>';
      renderImpostazioni(true);
    });
  }

  function salva() {
    if (!cfg.token) { location.hash = '#impostazioni'; return; }
    var btn = document.getElementById('salva');
    btn.disabled = true; stato('Saving…');
    dati.aggiornato = new Date().toISOString();
    var corpo = { message: 'Update tournaments', content: b64enc(JSON.stringify(dati, null, 2) + '\n'), branch: cfg.branch };
    if (sha) corpo.sha = sha;
    api('/contents/' + FILE, { method: 'PUT', body: JSON.stringify(corpo), headers: { 'Content-Type': 'application/json' } })
      .then(function (j) {
        sha = j.content.sha; modificato = false; scrivi('tornei.bozza', null);
        stato('Saved. The public site updates within 1–2 minutes.', 'ok');
      })
      .catch(function (e) {
        btn.disabled = false;
        if (e.status === 409) stato('The file was changed somewhere else. Reload the page and enter your latest changes again.', 'err');
        else if (e.status === 401 || e.status === 403) stato('The GitHub key is not valid or does not have write permission.', 'err');
        else stato('Save failed: ' + e.message, 'err');
      });
  }

  function scaricaCopia() {
    if (!dati) return;
    var blob = new Blob([JSON.stringify(dati, null, 2) + '\n'], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'tornei.json';
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---------- Views ---------- */
  function render() {
    var tab = (location.hash || '#impostazioni').slice(1);
    if (['impostazioni'].concat(T.GIOCHI).indexOf(tab) < 0) tab = 'impostazioni';
    document.querySelectorAll('nav.tabs a').forEach(function (a) {
      if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    if (!dati) return renderImpostazioni(true);
    if (tab === 'impostazioni') renderImpostazioni(false);
    else renderGioco(tab);
  }

  function renderImpostazioni(soloCollegamento) {
    var h = '<div class="stack-lg">';
    if (avviso.bozza) {
      h += '<div class="confirm"><span>You have unsaved changes from ' + new Date(avviso.bozza.quando).toLocaleString('en-GB') + '.</span>' +
        '<button type="button" data-azione="riprendi-bozza" class="primary">Restore</button><button type="button" data-azione="scarta-bozza">Discard</button></div>';
    }
    h += '<section class="card stack"><h2>GitHub connection</h2>' +
      '<p class="muted">Needed to save results to the site. The key stays in this browser only.</p>' +
      '<div class="form-grid">' +
      campo('cfg-owner', 'GitHub user', cfg.owner) +
      campo('cfg-repo', 'Repository', cfg.repo) +
      campo('cfg-branch', 'Branch', cfg.branch) +
      '<label for="cfg-token">Key (token)<input id="cfg-token" type="password" autocomplete="off" value="' + esc(cfg.token) + '" placeholder="github_pat_…"></label>' +
      '</div><div class="row"><button type="button" class="primary" data-azione="collega">Save and reload</button>' +
      (cfg.token ? '<button type="button" data-azione="scollega">Remove key</button>' : '') + '</div>' +
      '<details><summary>How to create the key</summary><ol style="margin:8px 0 0;padding-left:1.2rem;display:flex;flex-direction:column;gap:4px">' +
      '<li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>.</li>' +
      '<li>Name: "Tournaments". Expiration: at least until the end of January.</li>' +
      '<li>Repository access: "Only select repositories", then pick the tournaments repository.</li>' +
      '<li>Permissions → Repository permissions → Contents: "Read and write".</li>' +
      '<li>Generate the key, copy it and paste it above. Don\'t share it with anyone.</li></ol></details>' +
      '</section>';

    if (!soloCollegamento && dati) {
      var cal = dati.calendario;
      h += '<section class="card stack"><h2>Schedule and sign-up</h2><div class="form-grid">' +
        campoData('cal-aperturaIscrizioni', 'Sign-up opens', cal.aperturaIscrizioni) +
        campoData('cal-chiusuraIscrizioni', 'Sign-up closes', cal.chiusuraIscrizioni) +
        campoData('cal-sorteggio', 'Draw', cal.sorteggio) +
        campoData('cal-fineGironi', 'Group stage ends', cal.fineGironi) +
        campoData('cal-finali', 'Tournaments end', cal.finali) +
        '</div><div class="form-grid">' +
        campo('gen-linkIscrizioni', 'Sign-up form link (optional)', dati.linkIscrizioni, 'https://forms.gle/…') +
        campo('gen-contatto', 'Who to contact to sign up', dati.contatto) +
        '</div></section>';
    }
    document.getElementById('view').innerHTML = h + '</div>';
  }

  function campo(id, etichetta, valore, ph) {
    return '<label for="' + id + '">' + esc(etichetta) + '<input id="' + id + '" value="' + esc(valore || '') + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + '></label>';
  }
  function campoData(id, etichetta, valore) {
    return '<label for="' + id + '">' + esc(etichetta) + '<input type="date" id="' + id + '" value="' + esc(valore || '') + '"></label>';
  }

  function bottoneConferma(chiave, etichetta, domanda, cls) {
    if (conferma === chiave) {
      return '<div class="confirm"><span>' + esc(domanda) + '</span><button type="button" class="primary" data-azione="' + chiave + '">Yes, go ahead</button>' +
        '<button type="button" data-azione="annulla-conferma">Cancel</button></div>';
    }
    return '<button type="button" class="' + (cls || '') + '" data-chiedi="' + chiave + '">' + esc(etichetta) + '</button>';
  }

  function renderGioco(k) {
    var g = dati.giochi[k], m = V.META[k], n = V.nomi(g);
    var h = '<div class="stack-lg" style="--c:' + m.colore + '">';
    h += '<div class="row" style="justify-content:space-between"><div class="row"><span class="dot"></span><h2>' + esc(m.nome) + '</h2></div>' +
      '<span class="chip">' + esc(V.statoGioco(k, g, dati).testo) + '</span></div>';

    if (g.fase === 'iscrizioni') {
      var righe = (g.iscritti || []).map(function (e) { return e.nome; }).join('\n');
      h += '<section class="card stack"><h3>Players</h3>' +
        '<p class="muted">One entry per line: the team name or nickname if given, otherwise the player\'s name. This list is shown on the public website, so never add room numbers or contact details.' +
        (k === 'biliardino' ? ' A ready team: "Team name (team)". A pair without a team name: "Name + Name". A player alone: just the name, and they are paired at random at the draw.' : '') + '</p>' +
        '<label for="iscritti-' + k + '">List<textarea id="iscritti-' + k + '" data-iscritti="' + k + '" placeholder="' + (k === 'biliardino' ? 'Goal Diggers\nThe Wall\nNick1' : 'Pongasaurus\nSmash Bro\nNet Ninja') + '">' + esc(righe) + '</textarea></label>' +
        '<p class="muted" id="conteggio-' + k + '">' + conteggio(k, g) + '</p>' +
        '<div class="form-grid"><label for="num-' + k + '">Sign-ups shown on the site (used while the list above is empty)<input type="number" min="0" inputmode="numeric" id="num-' + k + '" data-num="' + k + '" value="' + esc(g.numeroIscritti || 0) + '"></label></div></section>';

      h += '<section class="card stack"><h3>Format and draw</h3><div class="form-grid">' +
        '<label for="formato-' + k + '">Format<select id="formato-' + k + '" data-formato="' + k + '">' +
        (k === 'scacchi' ? opt('automatico', 'Based on sign-ups (up to 8: round robin)', g.formato) : '') +
        opt('gironi', 'Groups + knockout', g.formato) +
        opt('campionato', 'One league, random opponents + knockout', g.formato) +
        opt('girone-unico', 'Single round robin, everyone plays everyone', g.formato) + '</select></label>' +
        (g.formato === 'gironi' ? numero('ng-' + k, 'Number of groups (empty = automatic)', g.numGironi || '', 'numGironi') : '') +
        (g.formato === 'campionato' ? numero('opp-' + k, 'Matches per team', g.avversari || 4, 'avversari') : '') +
        (g.formato !== 'girone-unico' && g.formato !== 'automatico' ? numero('q-' + k, g.formato === 'campionato' ? 'Teams to knockout' : 'Qualifiers per group', V.qualificatiDi(g), 'qualificati') : '') +
        '</div>' +
        '<p class="muted" id="anteprima-' + k + '">' + anteprimaSorteggio(k, g) + '</p>' +
        (avviso[k] ? '<p class="notice err">' + esc(avviso[k]) + '</p>' : '') +
        '<div>' + bottoneConferma('sorteggia-' + k, 'Run the draw', 'The draw closes sign-up and creates groups and matches. Go ahead?', 'primary') + '</div></section>';
    }

    if (g.fase === 'gironi') {
      var unico = V.formatoEffettivo(g) === 'girone-unico';
      var mancano = T.partiteMancanti(g.gironi);
      h += '<section class="card stack"><div class="form-grid">' + campoData('scad-gironi-' + k, 'Deadline for ' + (unico ? 'round robin' : 'group') + ' matches', g.scadenze.gironi) + '</div></section>';
      g.gironi.forEach(function (gr, gi) {
        h += '<section class="card stack"><h3>' + (unico ? 'Round robin' : V.formatoEffettivo(g) === 'campionato' ? 'League' : 'Group ' + esc(gr.nome)) + '</h3>' +
          V.tabellaClassifica(k, gr, n, V.qualificatiDi(g)) +
          '<div>' + gr.partite.map(function (p, pi) { return editPartita(k, p, n, 'g:' + gi + ':' + pi, true); }).join('') + '</div></section>';
      });
      h += '<section class="card stack">' + (mancano ? '<p class="muted">' + mancano + (mancano === 1 ? ' match' : ' matches') + ' still to play.</p>' : '<p>All matches have been played.</p>');
      if (!unico) {
        h += '<div>' + (mancano ? '<button type="button" disabled>Create knockout bracket</button>'
          : bottoneConferma('tabellone-' + k, 'Create knockout bracket', 'Create the bracket with the top ' + V.qualificatiDi(g) + (g.gironi.length > 1 ? ' of each group' : '') + '?', 'primary')) + '</div>';
      }
      h += '<div>' + bottoneConferma('annulla-sorteggio-' + k, 'Undo the draw', 'Delete groups and results and go back to sign-up?', 'danger') + '</div></section>';
    }

    if (g.fase === 'eliminazione') {
      var turni = T.turniEliminazione(g.eliminazione);
      turni.forEach(function (t, ti) {
        h += '<section class="card stack"><div class="row" style="justify-content:space-between"><h3>' + esc(t.nome) + '</h3>' +
          '<label for="scad-el-' + k + '-' + ti + '" style="flex-direction:row;align-items:center;gap:8px">By<input type="date" id="scad-el-' + k + '-' + ti + '" data-scad-el="' + k + ':' + ti + '" value="' + esc(g.scadenze.eliminazione[ti] || '') + '"></label></div><div>';
        t.partite.forEach(function (p) {
          if (p.bye && ti === 0) { h += '<div class="match-edit"><span class="a">' + esc(n[p.vincitore] || '') + '</span><span class="muted">bye</span><span></span></div>'; return; }
          if (!p.pronta) { h += '<div class="match-edit"><span class="a muted">' + (p.a ? esc(n[p.a]) : 'TBD') + '</span><span class="muted">–</span><span class="muted">' + (p.b ? esc(n[p.b]) : 'TBD') + '</span></div>'; return; }
          h += editPartita(k, p, n, 'k:' + p.id, false);
        });
        h += '</div></section>';
      });
      h += '<section class="card stack"><h3>Preview</h3>' + V.tabelloneHtml(k, g, n) + '</section>';
      h += '<div>' + bottoneConferma('torna-gironi-' + k, 'Delete bracket and go back to groups', 'Delete the bracket and its results?', 'danger') + '</div>';
    }

    document.getElementById('view').innerHTML = h + '</div>';
  }

  function numero(id, etichetta, valore, campo) {
    return '<label for="' + id + '">' + esc(etichetta) + '<input type="number" min="1" inputmode="numeric" id="' + id + '" data-campo="' + campo + '" value="' + esc(valore) + '"></label>';
  }

  function opt(v, t, sel) { return '<option value="' + v + '"' + (v === sel ? ' selected' : '') + '>' + esc(t) + '</option>'; }

  function conteggio(k, g) {
    var nn = (g.iscritti || []).length;
    if (k !== 'biliardino') return nn + ' signed up';
    var coppie = 0, singoli = 0;
    g.iscritti.forEach(function (e) { if ((e.nome.indexOf('+') >= 0 || /\(team\)\s*$/i.test(e.nome))) coppie++; else singoli++; });
    return coppie + ' teams already formed, ' + singoli + ' single players to pair' + (singoli % 2 ? ' (odd number: one is missing a partner)' : '');
  }

  function anteprimaSorteggio(k, g) {
    var nn = (g.iscritti || []).length;
    if (k === 'biliardino') {
      var c = 0, s = 0; g.iscritti.forEach(function (e) { if ((e.nome.indexOf('+') >= 0 || /\(team\)\s*$/i.test(e.nome))) c++; else s++; });
      nn = c + Math.floor(s / 2);
    }
    if (nn < 2) return 'At least 2 ' + (k === 'biliardino' ? 'teams' : 'players') + ' are needed for the draw.';
    var f = g.formato === 'automatico' ? (nn <= 8 ? 'girone-unico' : 'gironi') : g.formato;
    if (f === 'campionato') {
      var d = g.avversari || 4;
      if (d >= nn || (nn * d) % 2) return 'With ' + nn + ' entries, ' + d + ' matches each is not possible: change the number of matches per team.';
      return 'With ' + nn + ' entries: one league, ' + d + ' matches each against random opponents (' + (nn * d / 2) + ' matches in total), then a knockout with the top ' + V.qualificatiDi(g) + '.';
    }
    if (f === 'girone-unico') return 'With ' + nn + ' entries: one round robin of ' + (nn * (nn - 1) / 2) + ' matches, ' + (nn - 1) + ' each.';
    var ng = T.numeroGironi(nn, f, g.numGironi);
    var dim = []; for (var i = 0; i < ng; i++) dim.push(0); for (var j = 0; j < nn; j++) dim[j % ng]++;
    return 'With ' + nn + ' entries: ' + ng + (ng === 1 ? ' group of ' : ' groups of ') + dim.join(', ') + ', then a knockout with the top ' + V.qualificatiDi(g) + ' of each group.';
  }

  function editPartita(k, p, n, rif, girone) {
    var tie = T.giocata(p) && Number(p.ra) === Number(p.rb) && !(k === 'scacchi' && (girone || p.sp));
    var inputs, extra = '';
    if (k === 'scacchi') {
      var gamba = function (leg, label) {
        var val = p[leg] || '';
        return '<label class="muted" style="font-size:.8rem">' + label + ' <select data-leg="' + rif + ':' + leg + '" aria-label="' + label + '">' +
          opt('', '—', val) + opt('1-0', '1 – 0', val) + opt('0.5-0.5', '½ – ½', val) + opt('0-1', '0 – 1', val) + '</select></label>';
      };
      inputs = gamba('l1', '1st') + gamba('l2', '2nd');
      if (!girone && T.giocata(p) && Number(p.ra) === Number(p.rb)) {
        var sv = p.sp || '';
        extra = '<div class="match-edit"><span class="a muted">Tiebreak winner</span><span class="inputs"><select data-sp="' + rif + '" aria-label="Tiebreak winner">' +
          opt('', '—', sv) + opt('a', n[p.a], sv) + opt('b', n[p.b], sv) + '</select></span><span></span></div>';
      }
    } else {
      inputs = '<input class="sc" type="number" min="0" max="2" inputmode="numeric" data-ris="' + rif + ':a" value="' + esc(p.ra === null ? '' : p.ra) + '" aria-label="Score ' + esc(n[p.a]) + '">' +
        '<span class="muted">–</span>' +
        '<input class="sc" type="number" min="0" max="2" inputmode="numeric" data-ris="' + rif + ':b" value="' + esc(p.rb === null ? '' : p.rb) + '" aria-label="Score ' + esc(n[p.b]) + '">';
    }
    return '<div class="match-edit' + (tie ? ' tie' : '') + '"><span class="a">' + esc(n[p.a]) + '</span><span class="inputs">' + inputs + '</span><span>' + esc(n[p.b]) + '</span></div>' + extra +
      (tie ? '<p class="notice err" style="margin:0 0 6px">' + (k === 'scacchi' ? 'Level after two games: choose the tiebreak winner.' : 'A draw is not possible here: correct the score.') + '</p>' : '') +
      (k !== 'scacchi' && T.giocata(p) && Math.max(Number(p.ra), Number(p.rb)) !== 2 ? '<p class="notice err" style="margin:0 0 6px">Best of 3: the winner must have 2.</p>' : '');
  }

  /* ---------- Data changes ---------- */
  function trovaPartita(k, rif) {
    var g = dati.giochi[k], p = rif.split(':');
    if (p[0] === 'g') return g.gironi[Number(p[1])].partite[Number(p[2])];
    var id = p[1];
    if (!g.eliminazione.risultati[id]) g.eliminazione.risultati[id] = { ra: null, rb: null };
    return g.eliminazione.risultati[id];
  }

  function tabAttivo() { return (location.hash || '#impostazioni').slice(1); }

  function sorteggia(k) {
    var g = dati.giochi[k];
    var nomiLista = g.iscritti.map(function (e) { return e.nome; });
    if (k === 'biliardino') {
      var c = T.formaCoppie(nomiLista);
      if (c.spaiato) { avviso[k] = c.spaiato + ' has no partner: add or remove a single player before the draw.'; return; }
      nomiLista = c.squadre;
    }
    if (nomiLista.length < 2) { avviso[k] = 'At least 2 entries are needed.'; return; }
    delete avviso[k];
    g.iscritti = T.shuffle(nomiLista).map(function (nome, i) { return { id: 'e' + (i + 1), nome: nome }; });
    var f = g.formato === 'automatico' ? (g.iscritti.length <= 8 ? 'girone-unico' : 'gironi') : g.formato;
    g.formatoUsato = f;
    var ids = g.iscritti.map(function (e) { return e.id; });
    try {
      g.gironi = f === 'campionato' ? T.sorteggiaCampionato(ids, g.avversari || 4) : T.sorteggiaGironi(ids, f, g.numGironi);
    } catch (err) { avviso[k] = err.message; g.fase = 'iscrizioni'; delete g.formatoUsato; return; }
    g.scadenze.gironi = f === 'girone-unico' ? dati.calendario.finali : dati.calendario.fineGironi;
    g.fase = 'gironi';
  }

  function creaTabellone(k) {
    var g = dati.giochi[k];
    g.eliminazione = T.creaEliminazione(k, g.gironi, V.qualificatiDi(g));
    var nt = T.turniEliminazione(g.eliminazione).length;
    g.scadenze.eliminazione = T.scadenzeEliminazione(g.scadenze.gironi || dati.calendario.fineGironi, dati.calendario.finali, nt);
    g.fase = 'eliminazione';
  }

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.chiedi) { conferma = b.dataset.chiedi; render(); return; }
    var a = b.dataset.azione; if (!a) return;
    var k = tabAttivo();
    conferma = null;
    if (a === 'annulla-conferma') return render();
    if (a === 'collega') {
      cfg.owner = document.getElementById('cfg-owner').value.trim();
      cfg.repo = document.getElementById('cfg-repo').value.trim();
      cfg.branch = document.getElementById('cfg-branch').value.trim() || 'main';
      cfg.token = document.getElementById('cfg-token').value.trim();
      scrivi('tornei.owner', cfg.owner); scrivi('tornei.repo', cfg.repo); scrivi('tornei.branch', cfg.branch); scrivi('tornei.token', cfg.token || null);
      stato('Reloading…'); return carica();
    }
    if (a === 'scollega') { cfg.token = ''; scrivi('tornei.token', null); stato('Key removed', 'warn'); document.getElementById('salva').disabled = true; return render(); }
    if (a === 'riprendi-bozza') { dati = avviso.bozza.dati; delete avviso.bozza; segnaModifica(); return render(); }
    if (a === 'scarta-bozza') { delete avviso.bozza; scrivi('tornei.bozza', null); return render(); }
    if (a === 'sorteggia-' + k) { sorteggia(k); if (!avviso[k]) segnaModifica(); return render(); }
    if (a === 'tabellone-' + k) { creaTabellone(k); segnaModifica(); return render(); }
    if (a === 'annulla-sorteggio-' + k) {
      var g = dati.giochi[k];
      g.fase = 'iscrizioni'; g.gironi = []; g.eliminazione = null; delete g.formatoUsato;
      if (k === 'biliardino') g.iscritti.forEach(function (e) { if (e.nome.indexOf('+') < 0 && !/\(team\)\s*$/i.test(e.nome)) e.nome += ' (team)'; });
      segnaModifica(); return render();
    }
    if (a === 'torna-gironi-' + k) { var g2 = dati.giochi[k]; g2.fase = 'gironi'; g2.eliminazione = null; g2.scadenze.eliminazione = []; segnaModifica(); return render(); }
  });

  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.dataset.iscritti) {
      var k = el.dataset.iscritti;
      dati.giochi[k].iscritti = el.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean)
        .map(function (nome, i) { return { id: 'e' + (i + 1), nome: nome }; });
      segnaModifica();
      document.getElementById('conteggio-' + k).textContent = conteggio(k, dati.giochi[k]);
      document.getElementById('anteprima-' + k).textContent = anteprimaSorteggio(k, dati.giochi[k]);
    }
  });

  document.addEventListener('change', function (ev) {
    var el = ev.target, k = tabAttivo();
    if (el.dataset.num) { dati.giochi[el.dataset.num].numeroIscritti = Number(el.value) || 0; return segnaModifica(); }
    if (el.dataset.campo) { var gg = dati.giochi[k]; if (el.value === '') delete gg[el.dataset.campo]; else gg[el.dataset.campo] = Number(el.value); segnaModifica(); return render(); }
    if (el.dataset.formato) { dati.giochi[el.dataset.formato].formato = el.value; segnaModifica(); return render(); }
    if (el.dataset.ris) {
      var p = el.dataset.ris.split(':'), lato = p.pop();
      var m = trovaPartita(k, p.join(':'));
      m[lato === 'a' ? 'ra' : 'rb'] = el.value === '' ? null : Number(el.value);
      segnaModifica(); return render();
    }
    if (el.dataset.leg) {
      var q1 = el.dataset.leg.split(':'), leg = q1.pop();
      var mm = trovaPartita(k, q1.join(':'));
      if (el.value) mm[leg] = el.value; else delete mm[leg];
      if (mm.l1 && mm.l2) {
        var a1 = mm.l1.split('-'), a2 = mm.l2.split('-');
        mm.ra = Number(a1[0]) + Number(a2[0]); mm.rb = Number(a1[1]) + Number(a2[1]);
      } else { mm.ra = null; mm.rb = null; }
      if (mm.ra === null || mm.ra !== mm.rb) delete mm.sp;
      segnaModifica(); return render();
    }
    if (el.dataset.sp) {
      var ms = trovaPartita(k, el.dataset.sp);
      if (el.value) ms.sp = el.value; else delete ms.sp;
      segnaModifica(); return render();
    }
    if (el.dataset.scadEl) {
      var q = el.dataset.scadEl.split(':');
      dati.giochi[q[0]].scadenze.eliminazione[Number(q[1])] = el.value;
      return segnaModifica();
    }
    if (el.id.indexOf('scad-gironi-') === 0) { dati.giochi[el.id.slice(12)].scadenze.gironi = el.value; return segnaModifica(); }
    if (el.id.indexOf('cal-') === 0) { dati.calendario[el.id.slice(4)] = el.value; return segnaModifica(); }
    if (el.id.indexOf('gen-') === 0) { dati[el.id.slice(4)] = el.value.trim(); return segnaModifica(); }
  });

  document.getElementById('salva').addEventListener('click', salva);
  document.getElementById('scarica').addEventListener('click', scaricaCopia);
  window.addEventListener('hashchange', function () { conferma = null; render(); });
  window.addEventListener('beforeunload', function (e) { if (modificato) { e.preventDefault(); e.returnValue = ''; } });
  carica();
})();
</script>
</body>
</html>
